# Include this file after installing continuous_extrusion.py in klippy/extras.
[continuous_extrusion]
max_filament_speed: 2.0

# The export first uses stock SET_GCODE_VARIABLE. A missing macro raises an
# error in stock Klipper and stops a virtual-SD print before the object starts.
# An unknown custom command alone would only log a warning and keep printing.
[gcode_macro CONTINUOUS_EXTRUSION_CHECK]
variable_version: 1
gcode:
    {% if 'continuous_extrusion' not in printer %}
        {action_raise_error("Install the continuous extrusion module before printing this file")}
    {% elif printer.continuous_extrusion.api_version != 1 %}
        {action_raise_error("Continuous extrusion module version does not match this export")}
    {% endif %}
